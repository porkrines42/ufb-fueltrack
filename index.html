function exportChartPDF(){let svg=document.getElementById('spendingSVG');if(!svg)return;let copy=svg.cloneNode(true);copy.setAttribute('width','950');copy.setAttribute('height','360');let html=`<!doctype html><html><head><title>UFB FuelTrack spending report</title><style>body{font-family:Arial;padding:30px;color:#17263b}svg{width:100%}.chartbar{fill:#b61928}.chartline{fill:none;stroke:#b61928;stroke-width:3}.chartlabel{font:11px Arial;fill:#718096}@page{size:landscape;margin:16mm}</style></head><body><h1>United Food Brands · Fuel spending</h1><p>Period: ${esc(period)} ${period==='custom'?esc(customFrom)+' to '+esc(customTo):''} · Employee: ${esc(filterUser==='all'?'All merchandisers':user(filterUser).name)}</p>${copy.outerHTML}<p>Generated ${esc(fmtTime(new Date().toISOString()))} · Demo report</p><script>window.onload=()=>setTimeout(()=>window.print(),400)<\/script></body></html>`;let blob=new Blob([html],{type:'text/html'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.target='_blank';a.rel='noopener';a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);alert('A printable chart report will open in a new tab. Choose “Save as PDF” in the browser print dialog. Allow pop-ups if prompted.')}

ss="card" style="margin-top:17px"><div class="section" style="flex-wrap:wrap"><h2>Recent receipts</h2><button class="btn tiny secondary" onclick="tab='receipts';render()">View all</button></div><div class="filters sticky-filters"><input type="search" aria-label="Search recent receipts" placeholder="Search name, station, fuel, status…" value="${esc(recentSearch)}" oninput="recentSearch=this.value;document.getElementById('recentResults').innerHTML=receiptTable(selected().filter(r=>(employeeMatch(r))&&matchesSearch(r,recentSearch)).sort((a,b)=>(b.createdAt||b.date).localeCompare(a.createdAt||a.date)).slice(0,8))"></div><div id="recentResults">${receiptTable(recent)}</div></div>`}

function reportRows(){return selected().filter(r=>(employeeMatch(r))&&(reportStatus==='all'||r.status===reportStatus)&&multiMatch('status',r.status)&&(reportFuel==='all'||r.fuel===reportFuel)&&multiMatch('fuel',r.fuel)&&matchesSearch(r,reportSearch))}
function reportGroups(rs){let groups=new Map();for(let r of rs){let key=reportGroup==='employee'?user(r.userId).name:reportGroup==='station'?r.station:reportGroup==='status'?r.status:r.fuel;let g=groups.get(key)||{name:key,total:0,count:0};g.total+=Number(r.amount);g.count++;groups.set(key,g)}return [...groups.values()].sort((a,b)=>b.total-a.total)}
function reportCSV(){let rows=reportRows().sort((a,b)=>b.date.localeCompare(a.date));let headers=['Employee','Purchase date','Upload timestamp','Station','Location','Fuel grade','Amount','Status','Receipt ID'];let q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';let csv=[headers,...rows.map(r=>[user(r.userId).name,r.date,r.createdAt,r.station,r.location,r.fuel,r.amount,r.status,r.id])].map(a=>a.map(q).join(',')).join('\r\n');let url=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));let a=document.createElement('a');a.href=url;a.download='UFB_FuelTrack_Report_'+new Date().toISOString().slice(0,10)+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function breakdownVisual(groups,rs){if(!groups.length)return '<div class="empty">No data for these filters.</div>';let total=sum(rs),max=Math.max(...groups.map(g=>g.total),1),colors=['#b61928','#1c466c','#d88138','#547e80','#7b649b','#e5a84a','#56657b','#a7526a'];if(breakdownView==='bar')return `<div class="breakdown-bars">${groups.map((g,i)=>`<div class="breakdown-row" title="${esc(g.name)}: ${money(g.total)}"><span>${esc(g.name)}</span><div class="breakdown-track"><div style="width:${g.total/max*100}%;background:${colors[i%colors.length]}"></div></div><b>${money(g.total)}</b></div>`).join('')}</div>`;if(breakdownView==='pie'){let offset=0,stops=groups.map((g,i)=>{let a=offset;offset+=total?g.total/total*100:0;return `${colors[i%colors.length]} ${a}% ${offset}%`});return `<div class="pie-layout"><div class="pie-chart" style="background:conic-gradient(${stops.join(',')})" aria-label="Spending by ${esc(reportGroup)}"></div><div class="pie-legend">${groups.map((g,i)=>`<div><span style="background:${colors[i%colors.length]}"></span>${esc(g.name)} <b>${total?(g.total/total*100).toFixed(1):0}%</b></div>`).join('')}</div></div>`}return `<div class="tablewrap"><table><thead><tr><th>${reportGroup==='employee'?'Merchandiser':reportGroup==='station'?'Gas station':reportGroup==='fuel'?'Fuel grade':'Status'}</th><th>Receipts</th><th>Total</th><th>Share</th></tr></thead><tbody>${groups.map(g=>`<tr><td>${esc(g.name)}</td><td>${g.count}</td><td class="amount">${money(g.total)}</td><td>${total?(g.total/total*100).toFixed(1):0}%</td></tr>`).join('')}</tbody></table></div>`}
function toggleReportFilters(){let p=document.getElementById('reportSticky');if(!p)return;let expanded=p.classList.toggle('expanded');let b=p.querySelector('.report-mobile-toggle');if(b){b.setAttribute('aria-expanded',String(expanded));b.textContent=expanded?'Close filters ▴':'Filters ▾'}}
function reportsPage(){let allRs=reportRows(),rs=allRs.filter(r=>r.status!=='Rejected'),g=reportGroups(rs),avg=rs.length?sum(rs)/rs.length:0,active=new Set(rs.map(r=>r.userId)).size;let fuels=[...new Set(data.receipts.map(r=>r.fuel))].sort();return `<div class="card reportintro"><div class="section" style="flex-wrap:wrap"><div><div class="eyebrow">Analytics workspace</div><h2 style="font-size:21px;margin-top:7px">Explore fuel expenses</h2><div class="sub" style="margin-top:7px">Filter, compare, visualize, and export the same set of receipt records.</div></div><div class="actions"><button class="btn secondary" onclick="reportCSV()">↓ Export filtered CSV</button><button class="btn secondary" onclick="exportChartPDF()">↓ Export chart PDF</button></div></div></div><div class="report-sticky" id="reportSticky"><div class="report-sticky-top"><span class="report-sticky-label">REPORT FILTERS</span><span class="report-sticky-range">${period==='custom'?(activePreset?rangeNames[activePreset]+' · ':'Custom · ')+datefmt(customFrom)+' – '+datefmt(customTo):period==='all'?'All dates':period==='week'?'This week':period==='month'?'This month':period==='quarter'?'This quarter':'This year'}</span><button type="button" class="report-mobile-toggle" onclick="toggleReportFilters()" aria-expanded="false" aria-controls="reportFilterControls">Filters ▾</button></div><div class="filters reportfilters" id="reportFilterControls">${periodControl()}${employeeControl()}${multiControl('status')}${multiControl('fuel')}<input type="search" aria-label="Report search" placeholder="Search receipts…" value="${esc(reportSearch)}" onchange="reportSearch=this.value;render()"><button class="btn tiny secondary" onclick="period='month';activePreset='';filterUser='all';reportStatus='all';reportFuel='all';multi={employee:[],status:[],fuel:[]};reportSearch='';customFrom='';customTo='';render()">Reset filters</button></div><div class="sub report-count">${allRs.length} matching receipts · ${period==='custom'?(active function topEmployees(rs){let items=data.users.filter(u=>u.role==='merch').map(u=>({name:u.name,value:sum(rs.filter(r=>r.userId===u.id))})).sort((a,b)=>b.value-a.value).slice(0,5);return items.map((x,i)=>`<div class="statline"><span>${i+1}. ${esc(x.name)}</span><b>${money(x.value)}</b></div>`).join('')}function statusBreakdown(rs){return ['Pending','Approved','Paid','Rejected'].map(s=>`<div class="statline"><span><span class="pill ${s}">${s}</span></span><b>${rs.filter(r=>r.status===s).length}</b></div>`).join('')}
function receiptTable(rs){return `<div class="tablewrap"><table><thead><tr><th>Purchase date</th><th>Uploaded at</th>${me.role==='admin'?'<th>Employee</th>':''}<th>Station</th><th>Fuel</th><th>Amount</th><th>Status</th><th></th></tr></thead><tbody>${rs.length?rs.map(r=>`<tr><td>${datefmt(r.date)}</td><td>${esc(fmtTime(r.createdAt))}</td>${me.role==='admin'?`<td>${esc(user(r.userId).name)}</td>`:''}<td>${esc(r.station)}<div class="muted" style="font-size:11px">${esc(r.location)}</div></td><td>${esc(r.fuel)}</td><td class="amount">${money(r.amount)}</td><td><span class="pill ${r.status}">${r.status}</span></td><td><button class="btn tiny secondary" onclick="openReceipt('${r.id}')">View</button></td></tr>`).join(''):`<tr><td colspan="8" class="empty">No matching receipts</td></tr>`}</tbody></table></div>`}

function toggleUser(id){let u=user(id);u.active=!u.active;save();render()}function openAddUser(){showModal(`<div class="modalhead"><h2>Add demo merchandiser</h2><button class="x" onclick="closeModal()">✕</button></div><form onsubmit="addUser(event)"><div class="field"><label>Full name</label><input id="newName" required maxlength="80" placeholder="Employee name"></div><button class="btn">Add employee</button></form>`)}function addUser(e){e.preventDefault();let name=document.getElementById('newName').value.trim();if(!name)return;data.users.push({id:'m'+Date.now(),name,role:'merch',active:true});save();closeModal();render()}

function previewUpload(inp){uploadImg=null;inp.setCustomValidity('');let file=inp.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Choose an image file');return}let img=new Image();img.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,900/Math.max(img.width,img.height));c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext('2d').drawImage(img,0,0,c.width,c.height);uploadImg=c.toDataURL('image/jpeg',.65);inp.setCustomValidity('');document.getElementById('imagePreview').innerHTML=`<img class="preview" alt="Receipt preview" src="${uploadImg}">`;updateReceiptSubmitState()};img.src=URL.createObjectURL(file)}
function formatFuelCents(input){
  // Digits are interpreted as cents: 5 → $0.05, 5505 → $55.05.
  // Keep the field empty until the employee starts typing.
  let digits=input.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,9);
  let cents=Number(digits||0);
  input.dataset.cents=String(cents);
  input.value=digits?'$'+(cents/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):'';
  input.setCustomValidity('');
  try{input.setSelectionRange(input.value.length,input.value.length)}catch(e){}

function normalizeStation(raw){let t=raw.trim().replace(/\s+/g,' ').toLowerCase();const known={'shell':'Shell','bp':'BP','exxon':'Exxon','mobil':'Mobil','exxonmobil':'ExxonMobil','sunoco':'Sunoco','wawa':'Wawa','quickchek':'QuickChek','costco':'Costco','speedway':'Speedway','valero':'Valero','citgo':'Citgo','gulf':'Gulf','delta':'Delta','7-eleven':'7-Eleven','7 eleven':'7-Eleven'};return known[t]||t.replace(/\b[a-z]/g,c=>c.toUpperCase())}
function suggestFuelCities(input){let panel=document.getElementById('fuelCitySuggestions');if(!panel)return;input.dataset.citySelected='';let q=input.value.trim().toLowerCase();let matches=q?fuelCities.filter(x=>x.toLowerCase().includes(q)).slice(0,8):fuelCities.slice(0,8);panel.innerHTML=matches.map(x=>`<button type="button" onclick="chooseFuelCity('${x.replace(/'/g,"\\'")}')">${esc(x)}</button>`).join('')||'<span class="muted" style="padding:9px;display:block">No matches in demo city list</span>';panel.hidden=false}
function chooseFuelCity(city){let input=document.getElementById('flocation');input.value=city;input.dataset.citySelected=city;input.setCustomValidity('');document.getElementById('fuelCitySuggestions').hidden=true;updateReceiptSubmitState()}
function validateFuelCity(input){let panel=document.getElementById('fuelCitySuggestions');if(panel)panel.hidden=true;let match=fuelCities.find(x=>x.toLowerCase()===input.value.trim().toLowerCase());if(match){input.value=match;input.dataset.citySelected=match;input.setCustomValidity('')}else input.setCustomValidity('Select a city from the suggestions.');updateReceiptSubmitState()}
function validFuelDate(value){if(!/^\d{4}-\d{2}-\d{2}$/.test(value))return false;let d=new Date(value+'T12:00:00');return !Number.isNaN(d.getTime())&&localISO(d)===value&&value>=localISO(new Date(new Date().setFullYear(new Date().getFullYear()-1)))&&value<=today()}
function receiptMissingFields(){
 const missing=[],img=document.getElementById('receiptImage'),date=document.getElementById('fdate'),amount=document.getElementById('famount'),station=document.getElementById('fstation'),location=document.getElementById('flocation');
 if(!uploadImg)missing.push('Attach a receipt photo');
 if(!date||!validFuelDate(date.value))missing.push('Choose a valid purchase date');
 if(!amount||!(Number(amount.dataset.cents||0)>0))missing.push('Enter a valid total amount');
 if(!station||!station.value.trim())missing.push('Enter the gas station');
 if(!location||!fuelCities.some(c=>c.toLowerCase()===location.value.trim().toLowerCase()))missing.push('Select a city from the suggestions');
 return missing;
}
function updateReceiptSubmitState(){
 const btn=document.getElementById('submitReceiptBtn');if(!btn)return;
 const missing=receiptMissingFields();btn.classList.toggle('receipt-submit-unready',missing.length>0);
 btn.setAttribute('aria-disabled',missing.length?'true':'false');
 const feedback=document.getElementById('receiptFormFeedback');
 if(feedback&&!feedback.hidden&&missing.length===0){feedback.hidden=true;feedback.innerHTML=''}
 else if(feedback&&!feedback.hidden){feedback.innerHTML='<strong>Before submitting:</strong><ul>'+missing.map(m=>'<li>'+esc(m)+'</li>').join('')+'</ul>'}
}
function showReceiptMissing(missing){
 const feedback=document.getElementById('receiptFormFeedback');
 if(feedback){feedback.hidden=false;feedback.innerHTML='<strong>Please complete the following:</strong><ul>'+missing.map(m=>'<li>'+esc(m)+'</li>').join('')+'</ul>';feedback.scrollIntoView({behavior:'smooth',block:'nearest'})}
}
function submitReceipt(e){e.preventDefault();const missing=receiptMissingFields();if(missing.length){showReceiptMissing(missing);updateReceiptSubmitState();return;}if(!uploadImg){let fileInput=document.getElementById("receiptImage");fileInput.setCustomValidity("Attach a receipt photo before submitting.");fileInput.reportValidity();return;}let dateField=document.getElementById('fdate');if(!validFuelDate(dateField.value)){dateField.setCustomValidity('Choose a valid purchase date within the past 12 months, not in the future.');dateField.reportValidity();return}dateField.setCustomValidity('');let locationField=document.getElementById('flocation');validateFuelCity(locationField);if(!locationField.checkValidity()){locationField.reportValidity();return}let stationField=document.getElementById('fstation');stationField.value=normalizeStation(stationField.value);let field=document.getElementById('famount'),amount=Number(field.dataset.cents||0)/100;if(!(amount>0)){field.setCustomValidity('Enter a gas receipt amount greater than $0.00.');field.reportValidity();return}if(amount>250&&!confirm('You entered '+amount.toLocaleString('en-US',{style:'currency',currency:'USD'})+'. This is unusually high for a single gas receipt. Are you sure you want to submit it?')){field.focus();return;}data.receipts.unshift({id:'r'+Date.now(),userId:me.id,date:document.getElementById('fdate').value,amount,station:stationField.value,fuel:document.getElementById('ffuel').value,location:locationField.value,status:'Pending',image:uploadImg,createdAt:new Date().toISOString(),audit:[{at:new Date().toISOString(),by:me.name,from:null,to:'Pending'}]});save();closeModal();tab='receipts';period='all';render();alert('Demo receipt submitted successfully!')}
function sampleReceipt(r){let text=[['UNITED FOOD BRANDS','SAMPLE FUEL RECEIPT'],[r.station,r.location],['Date',r.date],['Fuel',r.fuel],['Total',money(r.amount)],['DEMO SAMPLE','NOT AN ACTUAL PURCHASE']];let y=48;return `<svg xmlns="http://www.w3.org/2000/svg" width="440" height="410" viewBox="0 0 440 410"><rect width="440" height="410" fill="#fff"/><rect x="20" y="20" width="400" height="370" rx="8" fill="#fafafa" stroke="#cbd5e1" stroke-dasharray="5 4"/><text x="220" y="55" text-anchor="middle" fill="#b61928" font-family="Arial" font-size="20" font-weight="bold">SAMPLE RECEIPT</text>${text.map(([a,b],i)=>`<text x="40" y="${100+i*43}" fill="#26364c" font-family="monospace" font-size="${i===5?13:16}">${esc(a)}</text><text x="400" y="${100+i*43}" text-anchor="end" fill="#26364c" font-family="monospace" font-size="${i===5?12:15}">${esc(b)}</text>`).join('')}<text x="220" y="365" text-anchor="middle" fill="#8b95a5" font-family="Arial" font-size="12">Illustrative image generated by FuelTrack POC</text></svg>`}
function receiptSrc(r){return r.image||'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(sampleReceipt(r))}
function downloadReceipt(id){let r=data.receipts.find(x=>x.id===id);if(!r)return;let a=document.createElement('a');a.href=receiptSrc(r);a.download='UFB-receipt-'+r.id+(r.image?'.jpg':'.svg');document.body.appendChild(a);a.click();a.remove()}
function openReceipt(id){let r=data.receipts.find(x=>x.id===id);if(!r||me.role!=='admin'&&r.userId!==me.id)return;let logs=r.audit||[];if(!logs.some(l=>l.kind==='submission'||!l.from))logs=[{at:r.createdAt,by:user(r.userId).name,from:null,to:'Pending',kind:'submission'},...logs];return showModal(`<div class="modalhead"><h2>Receipt details</h2><button class="x" onclick="closeModal()">✕</button></div><div class="section"><span class="pill ${r.status}">${r.status}</span><b style="font-size:25px">${money(r.amount)}</b></div><div class="statline"><span class="muted">Merchandiser</span><b>${esc(user(r.userId).name)}</b></div>${[['Purchase date',datefmt(r.date)],['Uploaded at',fmtTime(r.createdAt)],['Gas station',r.station],['Location',r.location],['Fuel type',r.fuel]].map(([k,v])=>`<div class="statline"><span class="muted">${k}</span><b>${esc(v)}</b></div>`).join('')}<img class="receipt-preview" alt="${r.image?'Uploaded receipt':'Generated sample receipt'}" src="${receiptSrc(r)}"><button class="btn secondary" style="width:100%" onclick="downloadReceipt('${r.id}')">↓ Download ${r.image?'receipt image':'sample receipt'}</button>${me.role==='admin'?`<h3 style="margin:25px 0 10px;font-size:15px">Reimbursement status</h3><div class="actions">${['Pending','Approved','Rejected','Paid'].map(s=>`<button class="btn tiny ${s===r.status?'active-status':'secondary'}" ${s===r.status?'disabled':''} onclick="setStatus('${r.id}','${s}')">${s===r.status?'✓ ':''}${s}</button>`).join('')}</div><h3 style="margin:25px 0 5px;font-size:15px">Submission &amp; audit history</h3><div class="audit">${logs.length?logs.slice().reverse().map(l=>`<div class="auditentry"><b>${esc(l.by)}</b> ${l.kind==='submission'||!l.from?'submitted receipt':'changed '+esc(l.from)+' → '+esc(l.to)}<div class="muted">${esc(fmtTime(l.at))}</div></div>`).join(''):`<div class="auditentry"><b>Demo seed</b> · Original status: ${esc(r.status)}<div class="muted">${esc(fmtTime(r.createdAt))} · Historical actions unavailable</div></div>`}</div>`:''}`)}
function setStatus(id,status){let r=data.receipts.find(x=>x.id===id);if(!r||me.role!=='admin'||r.status===status)return;let warning=r.status==='Paid'?'This receipt is already marked PAID. Changing its status will NOT reverse any reimbursement. ':'';if(!confirm(warning+`Change ${user(r.userId).name}'s receipt from ${r.status} to ${status}?`))return;let old=r.status;r.status=status;r.audit=r.audit||[];r.audit.push({at:new Date().toISOString(),by:me.name,from:old,to:status});save();closeModal();render();openReceipt(id)}

function downloadCSV(){let rs=tab==='receipts'?filteredReceipts():selected();let rows=[['Purchase Date','Uploaded At','Merchandiser','Gas Station','Location','Fuel Grade','Amount','Status'],...rs.map(r=>[r.date,fmtTime(r.createdAt),user(r.userId).name,r.station,r.location,r.fuel,r.amount.toFixed(2),r.status])];let csv=rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(',')).join('\r\n');let blob=new Blob([csv],{type:'text/csv;charset=utf-8;'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='UFB-FuelTrack-report-'+today()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
